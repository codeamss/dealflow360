<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DealFlow360 – Pipeline</title>
  <style>
    body {margin:0;font-family:Arial,sans-serif;background:#f4f4f9;color:#333;}
    nav {background:#2c3e50;color:#fff;padding:1rem;display:flex;align-items:center;justify-content:space-between;}
    .logo {font-size:1.5rem;font-weight:bold;}
    nav ul {display:flex;list-style:none;gap:1.5rem;}
    nav a {color:#ecf0f1;text-decoration:none;font-weight:500;}
    nav a:hover {text-decoration:underline;}
    main {padding:2rem;max-width:1200px;margin:auto;}
    .pipeline-kanban {max-width:1000px;margin:2rem auto;font-family:Arial,sans-serif;}
    .pipeline-kanban h2 {text-align:center;margin-bottom:1rem;}
    .columns {display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.5rem;}
    .column {background:#fff;border:1px solid #ddd;border-radius:8px;padding:1rem;box-shadow:0 2px 4px rgba(0,0,0,.1);}
    .column h3 {margin:0.5rem 0;color:#2c3e50;}
    .column ul {list-style:none;padding:0;margin:0;}
    .column li {padding:0.5rem 0;border-bottom:1px solid #eee;}
    .column li:last-child {border-bottom:none;}
    .column li strong {display:block;margin-bottom:0.2rem;}
  </style>
</head>
<body>
  <nav>
    <div class="logo"><h3>DealFlow360</h3></div>
    <ul>
      <li><a href="/">Quotations</a></li>
      <li><a href="/pipeline">Pipeline</a></li>
      <li><a href="/settings">Settings</a></li>
    </ul>
  </nav>
  <main>
    <div id="root"></div>
  </main>

  <!-- React & DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel for JSX transformation -->
  <script src="https://cdn.jsdelivr.net/@babel/core@7/browser.min.js"></script>

  <!-- PipelineKanban component (JSX) -->
  <script type="text/babel">
    import { useEffect, useState } from "react";

    const STATUS_ORDER = ["Draft", "Pending Approval", "Negotiation", "Confirmed"];

    export default function PipelineKanban() {
      const [quotations, setQuotations] = useState([]);
      const [error, setError] = useState("");

      useEffect(() => {
        fetch("/api/quotations")
          .then((res) => {
            if (!res.ok) throw new Error("Network error");
            return res.json();
          })
          .then((data) => setQuotations(data))
          .catch((err) => setError(err.message));
      }, []);

      if (error) return <p>Error: {error}</p>;

      // group quotations by status
      const columns = STATUS_ORDER.map((status) => ({
        status,
        items: quotations.filter((q) => q.status === status),
      }));

      return (
        <section className="pipeline-kanban">
          <h2>Quotation Pipeline</h2>
          {columns.map((col) => (
            <div key={col.status} className="column">
              <h3>{col.status}</h3>
              <ul>
                {col.items.map((q) => (
                  <li key={q.id}>
                    <strong>#{q.id}</strong> {q.customer_name || "Customer"} – {"$" + (q.total_price ?? q.lines.reduce((sum, line) => sum + (line.quantity * line.product?.price ?? 0), 0))}
                  </li>
                ))}
                {col.items.length === 0 && <li>No quotations</li>}
              </ul>
            </div>
          ))}
        </section>
      );
    }

    // Render the component into the page
    ReactDOM.render(<PipelineKanban />, document.getElementById("root"));
  </script>
</body>
</html>
